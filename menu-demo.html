<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>菜单方案对比 · 模舆机器人平台</title>
<style>
:root{--bg:#04070f;--panel:rgba(10,16,34,.88);--border:rgba(94,168,255,.16);--border-hi:rgba(94,168,255,.45);--cy:#22d3ee;--bl:#5ea8ff;--vi:#8b5cf6;--tx:#d5e6ff;--tx-dim:#6b7a90;--mono:'JetBrains Mono','Consolas',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:13px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 500px at 75% 15%,rgba(139,92,246,.12),transparent 60%),radial-gradient(700px 500px at 15% 85%,rgba(34,211,238,.1),transparent 60%);pointer-events:none}
button{font-family:inherit}
/* 顶部说明条 */
.hd{display:flex;align-items:center;gap:14px;padding:0 22px;height:48px;border-bottom:1px solid var(--border);flex:none}
.hd .t{font-size:15px;font-weight:700;background:linear-gradient(90deg,#22d3ee,#5ea8ff,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd .muted{color:var(--tx-dim);font-size:11px}
.sw{margin-left:auto;display:flex;gap:8px}
.sw button{padding:7px 16px;font-size:12px;border:1px solid var(--border);background:rgba(94,168,255,.06);color:var(--tx-dim);cursor:pointer;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);transition:.2s}
.sw button.on{color:var(--cy);border-color:var(--border-hi);background:rgba(34,211,238,.1);box-shadow:0 0 14px rgba(34,211,238,.2)}
#demo{height:calc(100vh - 48px);position:relative;overflow:hidden}
#demo>div{height:100%}
/* ---------- 方案 A：左侧图标栏 + 飞出二级 ---------- */
.a-wrap{display:flex;height:100%}
.a-rail{width:60px;flex:none;border-right:1px solid var(--border);background:rgba(6,10,22,.9);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.a-ic{width:44px;height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;color:var(--tx-dim);cursor:pointer;position:relative;transition:.18s;border:1px solid transparent}
.a-ic i{font-style:normal;font-family:var(--mono);font-size:7px;letter-spacing:1px;opacity:.6;margin-top:1px}
.a-ic:hover,.a-ic.on{color:var(--cy);background:rgba(34,211,238,.1);border-color:var(--border-hi);box-shadow:0 0 14px rgba(34,211,238,.18)}
.a-sep{width:28px;height:1px;background:var(--border);margin:6px 0}
.a-fly{position:absolute;left:66px;top:64px;width:252px;background:var(--panel);border:1px solid var(--border-hi);padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.6);display:none;z-index:10;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.a-fly.on{display:block;animation:fin .18s ease-out}
@keyframes fin{from{opacity:0;transform:translateX(-8px)}}
.a-fly h6{font-size:12px;color:var(--cy);padding:2px 8px 8px;border-bottom:1px solid var(--border);margin-bottom:6px}
.a-it{display:flex;gap:10px;padding:8px;border-radius:8px;cursor:pointer;transition:.15s}
.a-it:hover{background:rgba(94,168,255,.1)}
.a-it .ic{font-size:15px}
.a-it b{font-size:12px;color:var(--tx);display:block}
.a-it span{font-size:10px;color:var(--tx-dim)}
.a-note{position:absolute;left:80px;bottom:16px;font-size:10px;color:var(--tx-dim)}
/* ---------- 方案 B：顶栏一级 + 页内左侧竖排二级 ---------- */
.b-top{display:flex;gap:4px;padding:10px 22px;border-bottom:1px solid var(--border);background:rgba(6,10,22,.9)}
.b-mi{padding:8px 18px;font-size:12.5px;color:var(--tx-dim);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;letter-spacing:.5px}
.b-mi:hover{color:var(--tx)}
.b-mi.on{color:var(--cy);border-bottom:2px solid;border-image:linear-gradient(90deg,var(--vi),var(--cy)) 1;text-shadow:0 0 12px rgba(34,211,238,.45)}
.b-body{display:flex;flex:1;min-height:0}
.b-side{width:150px;flex:none;border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:4px;background:rgba(8,12,26,.6)}
.b-si{padding:10px 12px;font-size:12.5px;color:var(--tx-dim);border-left:3px solid transparent;cursor:pointer;border-radius:0 8px 8px 0;transition:.18s;display:flex;gap:8px;align-items:center}
.b-si:hover{color:var(--tx);background:rgba(94,168,255,.06)}
.b-si.on{color:var(--cy);border-left-color:var(--cy);background:linear-gradient(90deg,rgba(34,211,238,.14),transparent);font-weight:600}
.b-si small{display:block;font-size:9px;color:var(--tx-dim);font-weight:400}
/* 内容占位 */
.stage{flex:1;padding:26px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.sk{border:1px solid var(--border);border-radius:10px;background:rgba(10,16,34,.5)}
.sk.h{height:34px;display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--tx-dim)}
.sk-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;flex:1}
.sk-grid .sk{min-height:200px;display:flex;align-items:center;justify-content:center;color:var(--tx-dim);font-size:12px}
.verdict{position:absolute;right:22px;top:70px;width:250px;background:var(--panel);border:1px solid var(--border);padding:14px;font-size:11px;color:var(--tx-dim);line-height:1.8;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.verdict b{color:var(--cy);font-size:12px}
</style>
</head>
<body>
<div class="hd">
  <span class="t">菜单结构方案对比</span>
  <span class="muted">模舆机器人平台 · 仅演示一二级菜单形态，内容区为占位</span>
  <div class="sw">
    <button id="swA" class="on" onclick="show('A')">方案 A · 图标栏飞出</button>
    <button id="swB" onclick="show('B')">方案 B · 页内竖排二级</button>
  </div>
</div>
<div id="demo"></div>
<script>
const MENUS = [
  { icon:'🖥', name:'监控中心', en:'MONITOR', subs:[] },
  { icon:'📋', name:'任务中心', en:'TASKS', subs:[['🗂','任务列表','三维度：任务 / 机器人 / 空间'],['➕','新建任务','抽屉式编排器（动作而非页面）'],['🗃','媒体归档','任务视角 / 空间视角']] },
  { icon:'▦', name:'空间管理', en:'SPACE', subs:[['🏢','空间组织','空间树 + 信息面板 + 标签'],['📍','点位管理','平面图撒点 · 三维可见'],['🧊','比对与更新','α-2 实模比对链路']] },
  { icon:'🔌', name:'接入中心', en:'ACCESS', subs:[['🐕','接入列表','机器人台账与状态'],['🧩','能力与模组','API 连接管理'],['🎯','工作分配','岗位 / 可执行任务 / 排班']] },
  { icon:'🏢', name:'物业巡检', en:'PROP', scene:1, subs:[['🔍','识别复核','算法结果人工确认'],['📋','业务工单','隐患 → 整改 → 销项'],['⚙','场景配置','算法插件 / 参数']] },
  { icon:'🧭', name:'园区导览', en:'GUIDE', scene:1, subs:[['🎙','讲解词与问答','版本管理 + FAQ 资料库'],['⚙','场景配置','路线与参数']] },
];
let mode = 'A', aSel = 1, bSel = 1, bSub = 0, flyOn = false;
function stage(){ return `<div class="stage"><div class="sk h">🍞 面包屑 / 页面标题区（占位）</div><div class="sk-grid"><div class="sk">主内容区（占位）</div><div class="sk">侧栏内容（占位）</div></div></div>`; }
function renderA(){
  const m = MENUS[aSel];
  document.getElementById('demo').innerHTML = `<div class="a-wrap">
    <div class="a-rail">
      ${MENUS.map((x,i)=>`${x.scene&&i===4?'<div class="a-sep"></div>':''}<div class="a-ic ${i===aSel?'on':''}" onmouseenter="aSel=${i};flyOn=true;renderA()" onclick="aSel=${i};flyOn=true;renderA()">${x.icon}<i>${x.en}</i></div>`).join('')}
    </div>
    ${stage()}
    <div class="a-fly ${flyOn?'on':''}" style="top:${64 + aSel*50 + (aSel>=4?13:0)}px" onmouseleave="flyOn=false;renderA()">
      <h6>${m.icon} ${m.name}</h6>
      ${m.subs.length ? m.subs.map(s=>`<div class="a-it"><span class="ic">${s[0]}</span><div><b>${s[1]}</b><span>${s[2]}</span></div></div>`).join('') : '<div style="padding:10px;font-size:11px;color:var(--tx-dim)">无二级菜单 · 图标直达页面</div>'}
    </div>
    <div class="a-note">👆 悬停/点击左侧图标，飞出该菜单的二级项；无二级的菜单（监控中心）图标直达</div>
    <div class="verdict"><b>方案 A 特点</b><br>· 内容区最大化（一级只占 60px）<br>· 科技感最强，类 IDE / 飞书<br>· 场景包多了也好扩展（图标纵向堆叠）<br>· 代价：二级项 hover 才可发现，新用户需要适应</div>
  </div>`;
}
function renderB(){
  const m = MENUS[bSel];
  document.getElementById('demo').innerHTML = `<div style="display:flex;flex-direction:column;height:100%">
    <div class="b-top">${MENUS.map((x,i)=>`<div class="b-mi ${i===bSel?'on':''}" onclick="bSel=${i};bSub=0;renderB()">${x.icon} ${x.name}</div>`).join('')}</div>
    <div class="b-body">
      <div class="b-side">
        ${m.subs.length ? m.subs.map((s,i)=>`<div class="b-si ${i===bSub?'on':''}" onclick="bSub=${i};renderB()"><span>${s[0]}</span><div>${s[1]}<small>${s[2]}</small></div></div>`).join('') : '<div style="padding:10px;font-size:11px;color:var(--tx-dim)">该菜单无二级</div>'}
      </div>
      ${stage()}
    </div>
    <div class="verdict"><b>方案 B 特点</b><br>· 二级常驻可见，层级最清晰<br>· 改动最小（现在页面结构顺势改造）<br>· 二级项可带一句话说明，演示友好<br>· 代价：内容区左侧固定让出 150px</div>
  </div>`;
}
function show(m){ mode = m; document.getElementById('swA').classList.toggle('on',m==='A'); document.getElementById('swB').classList.toggle('on',m==='B'); m==='A'?renderA():renderB(); }
const pm = new URLSearchParams(location.search).get('m');
if(new URLSearchParams(location.search).get('fly')==='1'){ aSel=1; flyOn=true; }
if(pm==='B') show('B'); else renderA();
</script>
</body>
</html>
