  <polygon points="48,59.5 51.2,62.5 48,65.5 44.8,62.5" fill="#0c1c38"/>
  <path d="M 43.5 67 Q 48 70.5 52.5 67" fill="none" stroke="#0c1c38" stroke-width="1" stroke-linecap="round" opacity=".8"/>
