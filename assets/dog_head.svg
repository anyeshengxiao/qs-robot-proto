<linearGradient id="dhHalo" gradientUnits="userSpaceOnUse" x1="18" y1="84" x2="78" y2="86">
  <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#5ea8ff"/><stop offset="1" stop-color="#8b5cf6"/>
