<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<defs>
<linearGradient id="dhEdge" gradientUnits="userSpaceOnUse" x1="10" y1="8" x2="88" y2="76">
  <stop offset="0" stop-color="#6ff0ff"/><stop offset=".55" stop-color="#6aa8ff"/><stop offset="1" stop-color="#a78bff"/>
</linearGradient>
<radialGradient id="dhFace" gradientUnits="userSpaceOnUse" cx="48" cy="44" r="34">
  <stop offset="0" stop-color="#CFF2F7"/><stop offset=".55" stop-color="#7EC8D6"/><stop offset="1" stop-color="#4FA9BE"/>
