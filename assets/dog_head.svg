  <rect x="28" y="36" width="40" height="16" rx="8" fill="url(#dhVisor)" stroke="#22d3ee" stroke-width=".9" opacity=".97"/>
  <rect x="34" y="40.5" width="9.5" height="7" rx="3.5" fill="#6ff0ff" style="filter:drop-shadow(0 0 3px #6ff0ff)"/>
  <rect x="52.5" y="40.5" width="9.5" height="7" rx="3.5" fill="#6ff0ff" style="filter:drop-shadow(0 0 3px #6ff0ff)"/>
  <!-- 吻部 -->
