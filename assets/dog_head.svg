  <polygon points="26.5,28.5 29.5,15.5 37.5,22.5" fill="#A8E2EC" stroke="url(#dhEdge)" stroke-width=".6" stroke-linejoin="round"/>
  <polygon points="74,32 69,10 55,22" fill="#50BBCD" stroke="url(#dhEdge)" stroke-width="1.1" stroke-linejoin="round"/>
  <polygon points="69.5,28.5 66.5,15.5 58.5,22.5" fill="#A8E2EC" stroke="url(#dhEdge)" stroke-width=".6" stroke-linejoin="round"/>
