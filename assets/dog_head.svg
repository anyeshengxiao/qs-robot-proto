  <stop offset="0" stop-color="#0c1c38"/><stop offset="1" stop-color="#122a52"/>
</linearGradient>
</defs>
<g style="filter:drop-shadow(0 0 6px rgba(120,222,240,.55))">
  <!-- 定位光环 -->
  <ellipse cx="48" cy="84" rx="29" ry="5.6" fill="none" stroke="url(#dhHalo)" stroke-width="1.2" opacity=".85" stroke-dasharray="4 2.8"/>
